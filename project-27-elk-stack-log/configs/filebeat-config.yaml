apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: kube-system
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*.log

    output.elasticsearch:
      hosts: ["https://devops-es-es-http:9200"]
      username: elastic
      password: ${ELASTIC_PASSWORD}
      ssl.verification_mode: none
