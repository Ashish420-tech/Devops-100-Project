on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 18
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nodejs-app
          push: false
          tags: your-dockerhub-username/nodejs-app:latest
