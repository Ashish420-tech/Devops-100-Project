stages:
  - build
  - test
  - scan
  - staging-deploy
  - prod-deploy

image: docker:latest

services:
  - docker:dind

before_script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
build:
  stage: build
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA ./project-1-github-actions/nodejs-app
test:
  stage: test
  parallel: 2
  script:
    - echo "Running tests..."
scan:
  stage: scan
  script:
    - sonar-scanner -Dsonar.login=$SONAR_TOKEN

