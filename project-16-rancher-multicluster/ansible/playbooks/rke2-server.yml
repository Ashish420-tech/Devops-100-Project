- hosts: rancher
  become: yes

  tasks:

    - name: Install RKE2
      shell: curl -sfL https://get.rke2.io | sh -

    - name: Enable RKE2 server
      systemd:
        name: rke2-server
        enabled: yes
        state: started

    - name: Wait for Kubernetes API
      wait_for:
        port: 6443
        delay: 15
        timeout: 300

    - name: Create .kube directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy kubeconfig
      copy:
        src: /etc/rancher/rke2/rke2.yaml
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Update kubeconfig localhost
      replace:
        path: /home/ubuntu/.kube/config
        regexp: '127.0.0.1'
        replace: '13.233.125.13'
