apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-recording-rules
  namespace: monitoring
spec:
  groups:
  - name: node.rules
    interval: 30s
    rules:
    - record: node:cpu_usage_percent
      expr: |
        100 * (
          1 -
          avg by(instance)(
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          )
        )
