apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: custom-storage-recording-rules
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:

  - name: custom.storage.rules

    interval: 30s

    rules:

    - record: custom:pvc_usage_percent
      expr: |
        100 *
        (
          1 -
          (
            kubelet_volume_stats_available_bytes
            /
            kubelet_volume_stats_capacity_bytes
          )
        )
